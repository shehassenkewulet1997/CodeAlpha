<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha - Interactive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Interactive Image Gallery</h1>
    <div class="filter-buttons">
        <button class="active" onclick="filterGallery('all')">All</button>
        <button onclick="filterGallery('nature')">Nature</button>
        <button onclick="filterGallery ('tech')">Tech</button>
        <button onclick="filterGallery ('architecture')">Architecture</button>

    </div>

    <div class="gallery">
        <div class="gallery-item nature" onclick="openLightbox(0)">
            <img src="image/nature3.jpg" alt="">
        </div>
        <div class="gallery-item nature" onclick="openLightbox(1)">
            <img src="image/nature5.jpg" alt="">
        </div>

        <div class="gallery-item nature" onclick="openLightbox(2)">
            <img src="image/nature7.jpg" alt="">
        </div>

        <div class="gallery-item nature" onclick="openLightbox(3)">
            <img src="image/nature8.jpg" alt="">
        </div>



        <div class="gallery-item tech" onclick="openLightbox(4)">
            <img src="image/tech1.jpg" alt="">
        </div>
        <div class="gallery-item tech" onclick="openLightbox(5)">
            <img src="image/tech2.jpg" alt="">
        </div>
        <div class="gallery-item tech" onclick="openLightbox(6)">
            <img src="image/tech4.jpg" alt="">
        </div>
        <div class="gallery-item tech" onclick="openLightbox(7)">
            <img src="image/tech5.jpg" alt="">
        </div>


        <div class="gallery-item architecture" onclick="openLightbox(8)">
            <img src="image/arch1.jpg" alt="">
        </div>
        <div class="gallery-item architecture" onclick="openLightbox(9)">
            <img src="image/arch2.jpg" alt="">
        </div>
        <div class="gallery-item architecture" onclick="openLightbox(10)">
            <img src="image/arch4.jpg" alt="">
        </div>

        <div class="gallery-item architecture" onclick="openLightbox(11)">
            <img src="image/arch5.jpg" alt="">
        </div>
        <div class="gallery-item architecture" onclick="openLightbox(12)">
            <img src="image/arch6.jpg" alt="">
        </div>
        <div class="gallery-item architecture" onclick="openLightbox(13)">
            <img src="image/arch7.jpg" alt="">
        </div>
    </div>
    <div id="lightbox" class="lightbox">
        <span class="close-btn" onclick="closeLightbox()">X</span>
        <button class="nav-btn prev" onclick="changeImage(-1)"> &#10094;</button>
        <img id="lightbox-img" src="" alt="popup Image">
        <button class="nav-btn next" onclick="changeImage(1)">&#10095;</button>

    </div>
    <script src="app.js"></script>
</body>

</html>
